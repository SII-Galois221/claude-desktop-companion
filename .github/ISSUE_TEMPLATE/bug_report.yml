name: Bug report
description: Report a reproducible problem with synthetic or redacted evidence.
body:
  - type: markdown
    attributes:
      value: |
        Never upload real histories, account UUIDs, credentials, proxy configuration files or the app's data directory.
        For security vulnerabilities, follow SECURITY.md instead of posting exploit details publicly.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Companion revision, Claude Desktop version, macOS version and Python version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use made-up account aliases and synthetic data. Explain expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Remove account identifiers, personal paths, conversation text, IPs and secrets before sharing.

