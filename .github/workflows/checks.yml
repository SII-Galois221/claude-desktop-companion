name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check public source tree
        run: python3 scripts/check_public_tree.py
      - name: Test synthetic history and monitor fixtures
        run: python3 -B -m unittest discover -s backend -p 'test_*.py'
      - name: Build, test Swift models and verify local signature
        run: bash build-app.sh

